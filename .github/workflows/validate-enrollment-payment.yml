name: Validate Gulf Breeze Enrollment and Payment 0.2.0-dev-r2

on:
  push:
    branches:
      - agent/enrollment-payment-0.2.0-dev-r2-validation
    paths:
      - gulf-breeze-enrollment-payment-0.2.0-dev-r2.zip
      - enrollment-payment-runtime-test-0.2.0.php
      - validate-enrollment-payment-0.2.0-static.mjs
      - .github/workflows/validate-enrollment-payment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, openssl
          coverage: none

      - name: Verify package integrity, layout, syntax, and architecture
        run: |
          set -euo pipefail
          test "$(sha256sum gulf-breeze-enrollment-payment-0.2.0-dev-r2.zip | cut -d' ' -f1)" = "6b6af3fb18f02f0a26f1dd13caa7c5eb7af80554ba6b60da94cf378267385ec7"
          test "$(unzip -Z1 gulf-breeze-enrollment-payment-0.2.0-dev-r2.zip | sed -n '1p')" = "gulf-breeze-enrollment-payment/"
          test "$(unzip -Z1 gulf-breeze-enrollment-payment-0.2.0-dev-r2.zip | grep -E '^[^/]+/$' | sort -u)" = "gulf-breeze-enrollment-payment/"
          rm -rf /tmp/gb-ep-validation
          mkdir -p /tmp/gb-ep-validation
          unzip -q gulf-breeze-enrollment-payment-0.2.0-dev-r2.zip -d /tmp/gb-ep-validation
          GB_EP_PLUGIN_DIR=/tmp/gb-ep-validation/gulf-breeze-enrollment-payment node validate-enrollment-payment-0.2.0-static.mjs
          node --check /tmp/gb-ep-validation/gulf-breeze-enrollment-payment/assets/checkout.js
          find /tmp/gb-ep-validation/gulf-breeze-enrollment-payment -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l enrollment-payment-runtime-test-0.2.0.php
          ! grep -RniE 'Drive Smart|drivesmart' /tmp/gb-ep-validation/gulf-breeze-enrollment-payment

      - name: Install disposable exact-stack WordPress
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          mkdir -p /tmp/wordpress
          /tmp/wp-cli.phar core download --version=7.0.4 --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title='Gulf Breeze Enrollment Validation' --admin_user=admin --admin_password='validation-only-password' --admin_email=validation@example.invalid --skip-email --quiet
          /tmp/wp-cli.phar option update home http://127.0.0.1:8080 --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar option update siteurl http://127.0.0.1:8080 --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install woocommerce --version=11.0.1 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install learnpress --version=4.4.4 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-core-2.3.26-dev-r2.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-catalog-cart-0.1.4.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install woocommerce-paypal-payments --version=4.1.2 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar option update ucp_options '{"status":1,"end_date_toggle":0,"whitelisted_roles":["administrator"]}' --format=json --path=/tmp/wordpress --quiet
          checkout_id=$(/tmp/wp-cli.phar option get woocommerce_checkout_page_id --path=/tmp/wordpress)
          test "$checkout_id" -gt 0
          /tmp/wp-cli.phar post update "$checkout_id" --post_content='[woocommerce_checkout]' --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-enrollment-payment-0.2.0-dev-r2.zip" --activate --path=/tmp/wordpress --quiet

          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.4"
          test "$(/tmp/wp-cli.phar core version --path=/tmp/wordpress)" = "7.0.4"
          test "$(/tmp/wp-cli.phar plugin get woocommerce --field=version --path=/tmp/wordpress)" = "11.0.1"
          test "$(/tmp/wp-cli.phar plugin get learnpress --field=version --path=/tmp/wordpress)" = "4.4.4"
          test "$(/tmp/wp-cli.phar plugin get woocommerce-paypal-payments --field=version --path=/tmp/wordpress)" = "4.1.2"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-core --field=version --path=/tmp/wordpress)" = "2.3.26-dev"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-catalog-cart --field=version --path=/tmp/wordpress)" = "0.1.4"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-enrollment-payment --field=version --path=/tmp/wordpress)" = "0.2.0-dev-r2"
          test "$(/tmp/wp-cli.phar option get ucp_options --format=json --path=/tmp/wordpress | jq -r '.status')" = "1"

      - name: Run exact-stack enrollment and payment regression
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/enrollment-payment-runtime-test-0.2.0.php" --path=/tmp/wordpress

      - name: Run authenticated administrator HTTP smoke tests
        run: |
          set -euo pipefail
          PHP_CLI_SERVER_WORKERS=4 /tmp/wp-cli.phar server --host=127.0.0.1 --port=8080 --path=/tmp/wordpress >/tmp/gb-wordpress-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; cat /tmp/gb-wordpress-http.log' EXIT
          for attempt in {1..30}; do
            if curl -fsS --max-time 10 http://127.0.0.1:8080/wp-login.php -o /tmp/login-page.html; then break; fi
            sleep 1
          done
          curl -fsS --max-time 10 http://127.0.0.1:8080/wp-login.php -o /tmp/login-page.html

          curl -fsS -c /tmp/admin-cookies.txt http://127.0.0.1:8080/wp-login.php -o /tmp/admin-login.html
          curl -fsS -L -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt \
            --data-urlencode 'log=admin' \
            --data-urlencode 'pwd=validation-only-password' \
            --data-urlencode 'wp-submit=Log In' \
            --data-urlencode 'redirect_to=http://127.0.0.1:8080/wp-admin/' \
            http://127.0.0.1:8080/wp-login.php -o /tmp/admin-after-login.html
          grep -q 'wp-admin-bar' /tmp/admin-after-login.html

          assert_admin_page() {
            local url=$1
            local output=$2
            local status
            status=$(curl -sS --max-time 30 -L -b /tmp/admin-cookies.txt -c /tmp/admin-cookies.txt -o "$output" -w '%{http_code}' "$url")
            test "$status" = "200"
            ! grep -qiE 'critical error|fatal error|uncaught error' "$output"
          }

          assert_admin_page http://127.0.0.1:8080/wp-admin/ /tmp/admin-dashboard.html
          assert_admin_page http://127.0.0.1:8080/wp-admin/plugins.php /tmp/admin-plugins.html
          grep -q 'woocommerce-paypal-payments/woocommerce-paypal-payments.php' /tmp/admin-plugins.html
          grep -q 'gulf-breeze-enrollment-payment/gulf-breeze-enrollment-payment.php' /tmp/admin-plugins.html
          assert_admin_page http://127.0.0.1:8080/wp-admin/plugin-install.php /tmp/admin-plugin-install.html
          echo 'PASS authenticated administrator HTTP smoke tests'
