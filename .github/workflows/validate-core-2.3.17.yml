name: Validate Gulf Breeze Core 2.3.17 timing rebalance

on:
  push:
    branches:
      - agent/core-2.3.17-validation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none

      - name: Verify package, syntax, and static controls
        run: |
          set -euo pipefail
          test "$(unzip -Z1 gulf-breeze-core-2.3.17-dev-checkpoint.zip | sed -n '1p' | cut -d/ -f1)" = "gulf-breeze-core"
          mkdir -p /tmp/gb-core-2.3.17
          unzip -q gulf-breeze-core-2.3.17-dev-checkpoint.zip -d /tmp/gb-core-2.3.17
          GB_PLUGIN_DIR=/tmp/gb-core-2.3.17/gulf-breeze-core node static-build-test.mjs
          GB_PLUGIN_DIR=/tmp/gb-core-2.3.17/gulf-breeze-core node migration-model-test.mjs
          find /tmp/gb-core-2.3.17/gulf-breeze-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          ! grep -RniE 'Drive Smart|drivesmart' /tmp/gb-core-2.3.17/gulf-breeze-core
          test "$(sha256sum gulf-breeze-core-2.3.17-dev-checkpoint.zip | cut -d' ' -f1)" = "bf5bc297c1fcdc5695269a62ba38f656921193ac8d0fcbf73b32866918308f61"

      - name: Install disposable WordPress and LearnPress
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          mkdir -p /tmp/wordpress
          /tmp/wp-cli.phar core download --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title='Gulf Breeze Timing Validation' --admin_user=admin --admin_password='validation-only-password' --admin_email=validation@example.invalid --skip-email --quiet
          /tmp/wp-cli.phar plugin install learnpress --version=4.4.4 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-core-2.3.17-dev-checkpoint.zip" --activate --path=/tmp/wordpress --quiet

      - name: Run timing migration regression
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar eval 'if (!class_exists("Gulf_Breeze_Configuration") || GB_CORE_VERSION !== "2.3.17-dev") { throw new Exception("Unexpected Core build."); }' --path=/tmp/wordpress
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/core-timing-rebalance-test.php" --path=/tmp/wordpress
