name: Validate Gulf Breeze Enrollment and Payment 0.2.0-dev-r8

on:
  push:
    branches:
      - agent/enrollment-payment-0.2.0-dev-r8-validation
    paths:
      - gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip
      - gulf-breeze-enrollment-payment-0.2.0-dev-r8.sha256.txt
      - enrollment-payment-runtime-test-0.2.0-dev-r8.php
      - validate-enrollment-payment-0.2.0-r8.cjs
      - .github/workflows/validate-enrollment-payment-r8.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, openssl
          coverage: none

      - name: Verify package and PHP syntax
        run: |
          set -euo pipefail
          test "$(sha256sum gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip | cut -d' ' -f1)" = "5627d01345291b8202a5ae404cf53640c41f411d8491b6ce1cdcbaf203538480"
          test "$(unzip -Z1 gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip | sed -n '1p')" = "gulf-breeze-enrollment-payment/"
          test "$(unzip -Z1 gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip | grep -E '^[^/]+/$' | sort -u)" = "gulf-breeze-enrollment-payment/"
          rm -rf /tmp/gb-ep-validation
          mkdir -p /tmp/gb-ep-validation
          unzip -q gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip -d /tmp/gb-ep-validation
          GB_EP_PLUGIN_DIR=/tmp/gb-ep-validation/gulf-breeze-enrollment-payment node validate-enrollment-payment-0.2.0-r8.cjs
          node --check /tmp/gb-ep-validation/gulf-breeze-enrollment-payment/assets/checkout.js
          find /tmp/gb-ep-validation/gulf-breeze-enrollment-payment -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l enrollment-payment-runtime-test-0.2.0-dev-r8.php
          ! grep -RniE 'Drive Smart|drivesmart' /tmp/gb-ep-validation/gulf-breeze-enrollment-payment

      - name: Install disposable exact stack
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          mkdir -p /tmp/wordpress
          /tmp/wp-cli.phar core download --version=7.0.4 --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title='Gulf Breeze Enrollment Validation' --admin_user=admin --admin_password='validation-only-password' --admin_email=validation@example.invalid --skip-email --quiet
          /tmp/wp-cli.phar plugin install woocommerce --version=11.0.1 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install learnpress --version=4.4.4 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-core-2.3.26-dev-r2.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-catalog-cart-0.1.4.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install woocommerce-paypal-payments --version=4.1.2 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar option update ucp_options '{"status":1,"end_date_toggle":0,"whitelisted_roles":["administrator"]}' --format=json --path=/tmp/wordpress --quiet
          checkout_id=$(/tmp/wp-cli.phar option get woocommerce_checkout_page_id --path=/tmp/wordpress)
          /tmp/wp-cli.phar post update "$checkout_id" --post_content='[woocommerce_checkout]' --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip" --activate --path=/tmp/wordpress --quiet
          diff -qr /tmp/gb-ep-validation/gulf-breeze-enrollment-payment /tmp/wordpress/wp-content/plugins/gulf-breeze-enrollment-payment
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.4"
          test "$(/tmp/wp-cli.phar core version --path=/tmp/wordpress)" = "7.0.4"
          test "$(/tmp/wp-cli.phar plugin get woocommerce --field=version --path=/tmp/wordpress)" = "11.0.1"
          test "$(/tmp/wp-cli.phar plugin get learnpress --field=version --path=/tmp/wordpress)" = "4.4.4"
          test "$(/tmp/wp-cli.phar plugin get woocommerce-paypal-payments --field=version --path=/tmp/wordpress)" = "4.1.2"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-enrollment-payment --field=version --path=/tmp/wordpress)" = "0.2.0-dev-r8"

      - name: Run exact-stack regression
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/enrollment-payment-runtime-test-0.2.0-dev-r8.php" --path=/tmp/wordpress

      - name: Verify real student HTTP course access
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar server --host=127.0.0.1 --port=8080 --path=/tmp/wordpress >/tmp/gb-r8-wp-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/wp-login.php >/dev/null; then
              break
            fi
            sleep 1
          done
          course_url=$(/tmp/wp-cli.phar option pluck gb_ep_r8_http_fixture course_url --path=/tmp/wordpress)
          username=$(/tmp/wp-cli.phar option pluck gb_ep_r8_http_fixture username --path=/tmp/wordpress)
          password=$(/tmp/wp-cli.phar option pluck gb_ep_r8_http_fixture password --path=/tmp/wordpress)
          guest_status=$(curl -sS -o /tmp/gb-r8-guest-course.html -w '%{http_code}' "$course_url")
          test "$guest_status" = "404"
          curl -fsS -c /tmp/gb-r8-student.cookies -d "log=$username" -d "pwd=$password" -d 'wp-submit=Log In' -d 'redirect_to=http://127.0.0.1:8080/my-account/' http://127.0.0.1:8080/wp-login.php >/tmp/gb-r8-login.html
          student_status=$(curl -sS -b /tmp/gb-r8-student.cookies -o /tmp/gb-r8-student-course.html -w '%{http_code}' "$course_url")
          test "$student_status" = "200"
          grep -Fq 'Native Checkout Runtime Course' /tmp/gb-r8-student-course.html
          ! grep -Fqi 'Page not found' /tmp/gb-r8-student-course.html
