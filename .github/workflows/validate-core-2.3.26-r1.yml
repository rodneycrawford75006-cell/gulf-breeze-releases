name: Validate Gulf Breeze Core 2.3.26 revision 2

on:
  push:
    branches:
      - agent/core-2.3.26-validation
    paths:
      - gulf-breeze-core-2.3.26-dev-r2.zip
      - core-provider-profile-static-test.mjs
      - core-provider-profile-runtime-test.php
      - .github/workflows/validate-core-2.3.26-r1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli
          coverage: none

      - name: Verify SHA, package layout, PHP syntax, and static controls
        run: |
          set -euo pipefail
          test "$(sha256sum gulf-breeze-core-2.3.26-dev-r2.zip | cut -d' ' -f1)" = "83f9e865eaf89546dec810467c4246de5c5e1e9da68a2488c8e7d67e3928b1f9"
          test "$(unzip -Z1 gulf-breeze-core-2.3.26-dev-r2.zip | sed -n '1p')" = "gulf-breeze-core/"
          test "$(unzip -Z1 gulf-breeze-core-2.3.26-dev-r2.zip | grep -E '^[^/]+/$' | sort -u)" = "gulf-breeze-core/"
          mkdir -p /tmp/gb-core-2.3.26-r2
          unzip -q gulf-breeze-core-2.3.26-dev-r2.zip -d /tmp/gb-core-2.3.26-r2
          test -f /tmp/gb-core-2.3.26-r2/gulf-breeze-core/gulf-breeze-core.php
          GB_PLUGIN_DIR=/tmp/gb-core-2.3.26-r2/gulf-breeze-core node core-provider-profile-static-test.mjs
          find /tmp/gb-core-2.3.26-r2/gulf-breeze-core -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          ! grep -RniE 'Drive Smart|drivesmart' /tmp/gb-core-2.3.26-r2/gulf-breeze-core

      - name: Install disposable WordPress and LearnPress
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          mkdir -p /tmp/wordpress
          /tmp/wp-cli.phar core download --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title='Gulf Breeze Core Validation' --admin_user=admin --admin_password='validation-only-password' --admin_email=validation@example.invalid --skip-email --quiet
          /tmp/wp-cli.phar plugin install learnpress --version=4.4.4 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-core-2.3.26-dev-r2.zip" --activate --path=/tmp/wordpress --quiet

      - name: Run provider-profile runtime regression
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/core-provider-profile-runtime-test.php" --path=/tmp/wordpress
          /tmp/wp-cli.phar eval 'if (get_option("gb_curriculum_migration_version", "") !== "") { throw new Exception("Validation fixture unexpectedly advanced curriculum migrations."); }' --path=/tmp/wordpress
