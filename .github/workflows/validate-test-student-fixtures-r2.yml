name: Validate Gulf Breeze Test Student Fixtures 0.1.0-dev-r2

on:
  push:
    branches:
      - agent/test-student-fixtures-0.1.0-dev-r2-validation
    paths:
      - gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip
      - gulf-breeze-test-student-fixtures-0.1.0-dev-r2.sha256.txt
      - test-student-fixtures-validation/**
      - .github/workflows/validate-test-student-fixtures-r2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mysqli, openssl, iconv
          coverage: none

      - name: Verify focused package and PHP syntax
        run: |
          set -euo pipefail
          test "$(sha256sum gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip | cut -d' ' -f1)" = "c0ac3e3fdb397137c19b8d33c01332d25c01c9b66a385ab35e5890e1ba1cf632"
          test "$(unzip -Z1 gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip | wc -l)" = "2"
          test "$(unzip -Z1 gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip | sed -n '1p')" = "gulf-breeze-test-student-fixtures/readme.txt"
          test "$(unzip -Z1 gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip | sed -n '2p')" = "gulf-breeze-test-student-fixtures/gulf-breeze-test-student-fixtures.php"
          rm -rf /tmp/gb-fixture-validation
          mkdir -p /tmp/gb-fixture-validation
          unzip -q gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip -d /tmp/gb-fixture-validation
          find /tmp/gb-fixture-validation/gulf-breeze-test-student-fixtures -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l test-student-fixtures-validation/runtime-test.php
          python test-student-fixtures-validation/static-check.py gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip
          ! grep -RniE 'Drive Smart|drivesmart' /tmp/gb-fixture-validation/gulf-breeze-test-student-fixtures

      - name: Install disposable exact stack
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x /tmp/wp-cli.phar
          mkdir -p /tmp/wordpress
          /tmp/wp-cli.phar core download --version=7.0.4 --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar config create --path=/tmp/wordpress --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 --skip-check --quiet
          /tmp/wp-cli.phar core install --path=/tmp/wordpress --url=http://127.0.0.1:8080 --title='Gulf Breeze Fixture Validation' --admin_user=admin --admin_password='validation-only-password' --admin_email=validation@example.invalid --skip-email --quiet
          /tmp/wp-cli.phar plugin install woocommerce --version=11.0.1 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install learnpress --version=4.4.4 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-core-2.3.26-dev-r2.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-catalog-cart-0.1.4.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install woocommerce-paypal-payments --version=4.1.2 --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-enrollment-payment-0.2.0-dev-r8.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/releases/gulfbreeze-course-mastery-gate-0.2.0.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar option update ucp_options '{"status":1,"end_date_toggle":0,"whitelisted_roles":["administrator"]}' --format=json --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-certificates-0.1.0-dev-r2.zip" --activate --path=/tmp/wordpress --quiet
          /tmp/wp-cli.phar plugin install "$GITHUB_WORKSPACE/gulf-breeze-test-student-fixtures-0.1.0-dev-r2.zip" --activate --path=/tmp/wordpress --quiet
          diff -qr /tmp/gb-fixture-validation/gulf-breeze-test-student-fixtures /tmp/wordpress/wp-content/plugins/gulf-breeze-test-student-fixtures
          test "$(php -r 'echo PHP_MAJOR_VERSION.".".PHP_MINOR_VERSION;')" = "8.4"
          test "$(/tmp/wp-cli.phar core version --path=/tmp/wordpress)" = "7.0.4"
          test "$(/tmp/wp-cli.phar plugin get woocommerce --field=version --path=/tmp/wordpress)" = "11.0.1"
          test "$(/tmp/wp-cli.phar plugin get learnpress --field=version --path=/tmp/wordpress)" = "4.4.4"
          test "$(/tmp/wp-cli.phar plugin get woocommerce-paypal-payments --field=version --path=/tmp/wordpress)" = "4.1.2"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-enrollment-payment --field=version --path=/tmp/wordpress)" = "0.2.0-dev-r8"
          test "$(/tmp/wp-cli.phar plugin get gulfbreeze-course-mastery-gate --field=version --path=/tmp/wordpress)" = "0.2.0"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-certificates --field=version --path=/tmp/wordpress)" = "0.1.0-dev-r2"
          test "$(/tmp/wp-cli.phar plugin get gulf-breeze-test-student-fixtures --field=version --path=/tmp/wordpress)" = "0.1.0-dev-r2"

      - name: Run focused fixture-gate regression
        run: |
          set -euo pipefail
          /tmp/wp-cli.phar eval-file "$GITHUB_WORKSPACE/test-student-fixtures-validation/runtime-test.php" --path=/tmp/wordpress
